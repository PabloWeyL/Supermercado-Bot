name: Verificar publicacion sin datos sensibles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Revisar archivos y secretos reconocibles
        run: python3 tools/verificar_publicacion.py --revision HEAD
